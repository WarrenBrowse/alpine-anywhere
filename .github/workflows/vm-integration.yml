name: vm-integration

# lint: repo-wide shellcheck + the shellspec suite, on a GitHub-hosted runner.
#
# vm: boots a disposable QEMU guest and runs the full install -> reboot -> A/B
# upgrade -> rollback -> auto-rollback lifecycle (spec/integration/vm/). This is
# the only coverage of the pivot/takeover + repartition-the-running-disk path
# that can brick a server, so it is the gate to run before each exit-fleet bump.
# It needs nested virtualization done right, so it runs on a self-hosted x86_64
# runner (label `warren`) and is restricted to same-repo events: a pull request
# from a fork never reaches the self-hosted runner.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One vm run per ref on the shared self-hosted runner; a new push cancels the old.
concurrency:
  group: vm-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + shellspec
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          if ! command -v shellspec >/dev/null 2>&1; then
            curl -fsSL https://git.io/shellspec | sh -s -- --yes --prefix "$HOME/.local"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Repo-wide: POSIX syntax + shellcheck (the whole tree is clean and gated),
      # then the full shellspec unit + integration suite. The VM harness (below)
      # covers the boot/brick path; these gate every merge on the fast checks.
      - name: Lint (sh -n + shellcheck, repo-wide)
        run: make lint
      - name: Unit + integration tests (shellspec)
        run: make test

  vm:
    # Self-hosted runner: never exposed to fork PRs. Same-repo pull requests and
    # manual dispatch only (pushes to master run the fast lint job above; the vm
    # gate runs via the open PR or a manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, warren]
    needs: lint
    timeout-minutes: 60
    env:
      AA_VM_RAM_MB: "2048"
      AA_VM_DISK_GB: "6"
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + NoCloud tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage
          ls -l /dev/kvm 2>/dev/null || echo "no /dev/kvm - harness will fall back to TCG"

      - name: VM lifecycle test
        # Cache the seed image on the runner between runs (free, fast).
        run: |
          export AA_VM_CACHE="$HOME/.cache/aa-vm"
          mkdir -p "$AA_VM_CACHE"
          make test-vm
